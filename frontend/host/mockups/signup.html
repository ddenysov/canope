<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - RideFinder</title>

    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Подключение шрифта Inter с Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Применение шрифта Inter ко всему документу */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

<!-- Навигационная панель (Навбар) -->
<header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
        <!-- Логотип -->
        <a href="#" class="flex items-center space-x-2 text-2xl font-bold text-gray-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-teal-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1v2"/>
                <path d="m4.93 4.93 1.41 1.41"/>
                <path d="M20.41 19.07a9 9 0 1 0-11.31-11.31"/>
                <path d="M12 21a9 9 0 0 0 9-9"/>
                <path d="M12 3a9 9 0 0 1 9 9"/>
                <circle cx="12" cy="12" r="2"/>
                <path d="M5 12h.01"/>
                <path d="M19 12h.01"/>
                <path d="m4.93 19.07 1.41-1.41"/>
                <path d="m17.66 6.34 1.41-1.41"/>
            </svg>
            <span>RideFinder</span>
        </a>

        <!-- Навигационные ссылки -->
        <div class="hidden md:flex items-center space-x-6">
            <a href="#" class="text-gray-600 hover:text-teal-500 transition-colors">Покатушки</a>
            <a href="#" class="text-gray-600 hover:text-teal-500 transition-colors">Увійти</a>
            <a href="#" class="bg-teal-500 hover:bg-teal-600 text-white font-semibold px-5 py-2 rounded-lg shadow-md transition-all duration-300">
                Реєстрація
            </a>
        </div>
        <!-- Мобильное меню (иконка) -->
        <div class="md:hidden">
            <button class="text-gray-600 hover:text-teal-500 focus:outline-none">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
        </div>
    </nav>
</header>

<!-- Основной контент - Форма регистрации -->
<main class="flex items-center justify-center min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="bg-white p-8 md:p-10 rounded-xl shadow-lg">
            <div class="text-center">
                <h2 class="mt-2 text-3xl font-bold text-gray-900">
                    Створити новий акаунт
                </h2>
                <p class="mt-2 text-sm text-gray-600">
                    Приєднуйтесь до спільноти RideFinder!
                </p>
            </div>

            <!-- Форма -->
            <form class="mt-8 space-y-6" action="#" method="POST">
                <input type="hidden" name="remember" value="true">
                <div class="rounded-md shadow-sm -space-y-px flex flex-col gap-y-4">
                    <!-- Поле для имени -->
                    <div>
                        <label for="name" class="sr-only">Ім'я</label>
                        <input id="name" name="name" type="text" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition" placeholder="Ім'я">
                    </div>

                    <!-- Поле для email -->
                    <div>
                        <label for="email-address" class="sr-only">Електронна пошта</label>
                        <input id="email-address" name="email" type="email" autocomplete="email" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition" placeholder="Електронна пошта">
                    </div>

                    <!-- Поле для пароля -->
                    <div>
                        <label for="password" class="sr-only">Пароль</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition" placeholder="Пароль">
                    </div>

                    <!-- Поле для подтверждения пароля -->
                    <div>
                        <label for="confirm-password" class="sr-only">Підтвердити пароль</label>
                        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition" placeholder="Підтвердити пароль">
                    </div>
                </div>

                <!-- Кнопка отправки -->
                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-teal-500 hover:bg-teal-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition-all duration-300 shadow-md">
                        Зареєструватися
                    </button>
                </div>
            </form>

            <!-- Ссылка на страницу входа -->
            <div class="text-sm text-center mt-6">
                <p class="text-gray-600">
                    Вже є акаунт?
                    <a href="#" class="font-medium text-teal-500 hover:text-teal-600 transition-colors">
                        Увійти
                    </a>
                </p>
            </div>
        </div>
    </div>
</main>

</body>
</html>
